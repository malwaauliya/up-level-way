w:"\"Sorry, could you repeat the question, please?\" sopan dan wajar. \"What?\" dan \"Repeat.\" terdengar kasar dalam konteks formal. Mengatakan tidak mengerti bahasa Inggris merusak kesan secara keseluruhan, padahal masalahnya hanya tidak mendengar."},
{q:"Kamu butuh beberapa detik untuk memikirkan contoh yang bagus. Apa yang sebaiknya kamu katakan?",
o:["Diam selama 20 detik","\"That's a good question. Let me think for a moment.\"","\"Next question, please.\"","\"Wait.\""],a:1,
w:"Mengucapkan bahwa kamu sedang berpikir membuat jeda terasa wajar dan profesional. Diam lama tanpa penjelasan membuat pewawancara bingung. \"Wait.\" terdengar seperti perintah, dan meminta pertanyaan lain menghindari pertanyaan."},
{q:"Pewawancara bertanya tentang GraphQL, dan kamu belum pernah memakainya. Jawaban terbaik adalah...",
o:["\"Yes, I'm an expert in GraphQL.\"","\"No.\"","\"I haven't worked with GraphQL directly, but my understanding is that the client asks for exactly the data it needs. I've worked a lot with REST APIs.\"","\"GraphQL is not important.\""],a:2,
w:"Jawaban ini jujur, menunjukkan pemahaman dasar, lalu mengarahkan ke pengalaman yang relevan. Mengaku ahli mudah terbongkar dengan satu pertanyaan lanjutan. \"No.\" menutup percakapan, dan meremehkan teknologi terdengar defensif."},
{q:"Kamu ingin memastikan maksud pertanyaan sebelum menjawab. Kalimat mana yang benar?",
o:["\"Just to make sure I understand, you're asking about how I manage state in large apps, right?\"","\"You ask what?\"","\"Your question is not clear.\"","\"I make sure you asking state?\""],a:0,
w:"\"Just to make sure I understand, you're asking about..., right?\" adalah pola yang alami dan sopan. \"You ask what?\" dan pilihan terakhir tidak gramatikal. \"Your question is not clear.\" terdengar menyalahkan pewawancara."},
{q:"Lengkapi kalimat: \"Could you give me an ___ of what you mean?\"",
o:["example","examples","exemple","a example"],a:0,
w:"Setelah \"an\" dibutuhkan kata benda tunggal yang diawali bunyi vokal: \"an example\". \"examples\" jamak sehingga tidak cocok dengan \"an\". \"exemple\" adalah ejaan Prancis. \"a example\" salah karena example diawali bunyi vokal."},
{q:"Di tengah jawaban, kalimatmu berantakan. Cara terbaik memperbaikinya adalah...",
o:["Berhenti bicara","\"Sorry, let me rephrase that.\"","\"My English is bad, sorry, sorry.\"","Melanjutkan walaupun tidak masuk akal"],a:1,
w:"\"Sorry, let me rephrase that.\" singkat, profesional, dan memberi kesempatan mengulang dengan lebih jelas. Penutur asli juga sering memakainya. Meminta maaf berulang soal bahasa Inggris membuatmu terlihat kurang percaya diri."}
]
},
{
id: "e2", days: 5, title: "Tell me about yourself",
goals: [
"Menyusun jawaban 60 sampai 90 detik dengan pola present, past, future",
"Memakai present perfect untuk pengalaman yang masih berlangsung",
"Menutup jawaban dengan alasan tertarik pada posisi itu"
],
material: `
<h3>Pola present, past, future</h3>
<ol>
<li><b>Present</b>: posisimu sekarang dan fokus pekerjaanmu.</li>
<li><b>Past</b>: pengalaman sebelumnya yang relevan, satu pencapaian.</li>
<li><b>Future</b>: kenapa kamu tertarik dengan posisi ini.</li>
</ol>
<p>Durasi ideal 60 sampai 90 detik. Ini bukan cerita hidup: tidak perlu tempat lahir, keluarga, atau hobi kecuali relevan.</p>
<h3>Contoh</h3>
<blockquote>I'm a frontend developer, and I've been working in web development for [X] years. Right now I mainly build products with React and Next.js, and I focus on performance and reusable components. Before that, I worked as a full-stack developer with Laravel and Node.js, so I'm comfortable working with APIs and databases too. Recently, I improved the load time of our main product page by [X]%. I'm now looking for a role in an international team where I can grow and build products for a bigger audience, and that's why this position caught my attention.</blockquote>
<h3>Grammar yang sering dipakai</h3>
<ul>
<li><b>Present perfect continuous</b> untuk hal yang dimulai di masa lalu dan masih berlangsung: "I <u>have been working</u> as a developer for four years."</li>
<li><b>Past simple</b> untuk hal yang sudah selesai: "Before that, I <u>worked</u> as a full-stack developer."</li>
<li>"I'm experienced <u>in</u> React" atau "I have experience <u>with</u> React". Bukan "I'm experience in".</li>
</ul>
<h3>Yang dihindari</h3>
<ul>
<li>Mengeluh tentang kantor atau gaji saat ini.</li>
<li>Membacakan isi CV baris per baris.</li>
<li>Bicara lebih dari 2 menit.</li>
</ul>`,
questions: [
{q:"Urutan isi yang paling efektif untuk menjawab \"Tell me about yourself\" adalah...",
o:["Tempat lahir, sekolah, keluarga, hobi","Present (posisi sekarang), past (pengalaman relevan), future (kenapa posisi ini)","Membacakan CV dari awal sampai akhir","Langsung menyebut gaji yang diinginkan"],a:1,
w:"Pola present, past, future membuat jawaban singkat, relevan, dan berakhir di alasanmu melamar. Cerita hidup dan membacakan CV terlalu panjang dan tidak fokus. Gaji dibahas di tahap lain."},
{q:"Pilih bentuk yang benar: \"I ___ as a frontend developer for four years.\" (kamu masih bekerja sebagai frontend developer)",
o:["am working","have been working","worked","work"],a:1,
w:"Untuk sesuatu yang dimulai di masa lalu dan masih berlangsung, dengan keterangan \"for four years\", dipakai present perfect continuous: \"have been working\". \"worked\" berarti sudah berhenti. \"am working\" dan \"work\" tidak dipakai bersama \"for four years\" untuk durasi."},
{q:"Kalimat mana yang benar?",
o:["\"I'm experience in React.\"","\"I'm experienced in React.\"","\"I have experienced in React.\"","\"I experience React.\""],a:1,
w:"\"experienced\" adalah kata sifat: \"I'm experienced in React.\" Bentuk lain yang benar adalah \"I have experience with React.\" (experience sebagai kata benda). \"I'm experience\" mencampur keduanya dan salah."},
{q:"Berapa durasi ideal untuk jawaban \"Tell me about yourself\"?",
o:["10 detik","Sekitar 60 sampai 90 detik","5 menit","Selama mungkin agar terlihat berpengalaman"],a:1,
w:"Satu sampai satu setengah menit cukup untuk memberi gambaran dan memancing pertanyaan lanjutan. Jawaban 10 detik terlalu tipis, dan jawaban 5 menit membuat pewawancara kehilangan fokus."},
{q:"Kalimat penutup mana yang paling kuat?",
o:["\"So, yeah. That's all.\"","\"I'm looking for a role in an international team where I can grow, and that's why this position caught my attention.\"","\"I want to leave my company because the salary is low.\"","\"Any job is fine for me.\""],a:1,
w:"Penutup yang kuat menghubungkan dirimu dengan posisi yang dilamar. \"That's all\" terasa menggantung. Mengeluhkan gaji memberi kesan negatif, dan \"any job is fine\" menunjukkan kamu tidak tertarik secara khusus."},
{q:"Pilih bentuk yang benar: \"Before that, I ___ as a full-stack developer with Laravel.\" (pekerjaan itu sudah selesai)",
o:["have worked","worked","am working","have been working"],a:1,
w:"Pekerjaan yang sudah selesai di masa lalu, dengan penanda \"before that\", memakai past simple: \"worked\". Present perfect dan present continuous menunjukkan hubungan dengan saat ini, yang tidak cocok di sini."}
]
},
{
id: "e3", days: 6, title: "Menceritakan project",
goals: [
"Memakai past simple, termasuk kata kerja tidak beraturan",
"Membedakan kapan memakai \"I\" dan \"we\"",
"Memakai kata penghubung dan angka untuk menunjukkan hasil"
],
material: `
<h3>Past simple untuk project yang sudah selesai</h3>
<div class="tbl"><table>
<tr><th>Bentuk dasar</th><th>Past</th><th>Contoh</th></tr>
<tr><td>build</td><td>built</td><td>I built a dashboard for the sales team.</td></tr>
<tr><td>find</td><td>found</td><td>I found a memory leak in the chart component.</td></tr>
<tr><td>lead</td><td>led</td><td>I led the migration to Next.js.</td></tr>
<tr><td>write</td><td>wrote</td><td>I wrote unit tests for the checkout flow.</td></tr>
<tr><td>choose</td><td>chose</td><td>We chose PostgreSQL because...</td></tr>
<tr><td>improve</td><td>improved</td><td>I improved the load time by 40%.</td></tr>
</table></div>
<p>Hati-hati: "founded" berarti mendirikan (perusahaan). Bentuk lampau dari "find" adalah "found".</p>
<h3>"I" atau "we"?</h3>
<p>Pewawancara ingin tahu kontribusimu. Pakai "we" untuk konteks tim, lalu "I" untuk bagianmu: "We were migrating to Next.js. I was in charge of the product pages."</p>
<h3>Kata penghubung</h3>
<ul>
<li>Urutan: <i>first, then, after that, finally</i></li>
<li>Alasan: <i>because, since</i></li>
<li>Akibat: <i>so, as a result</i></li>
<li>Pertentangan: <i>however, but</i></li>
</ul>
<h3>Pakai angka</h3>
<p>"It was faster" lemah. "The page load time dropped from 6 seconds to 2 seconds" kuat. Jika tidak punya angka pasti, pakai perkiraan yang jujur: "roughly", "about".</p>
<h3>Frasa berguna</h3>
<ul>
<li>"I was in charge of..." (bertanggung jawab atas)</li>
<li>"I worked closely with the designer to..."</li>
<li>"The main challenge was..."</li>
</ul>`,
questions: [
{q:"Pilih bentuk yang benar: \"Last year, I ___ a dashboard for our sales team.\"",
o:["build","builded","built","have built"],a:2,
w:"\"Last year\" menunjukkan waktu lampau yang sudah selesai, jadi dipakai past simple. Bentuk lampau dari \"build\" tidak beraturan: \"built\". \"builded\" tidak ada, dan present perfect tidak dipakai dengan keterangan waktu lampau yang spesifik."},
{q:"Pilih bentuk yang benar: \"I ___ a bug in the checkout flow that caused double payments.\"",
o:["finded","found","founded","find"],a:1,
w:"Bentuk lampau dari \"find\" adalah \"found\". \"founded\" adalah bentuk lampau dari \"found\" yang berarti mendirikan, misalnya \"She founded a startup.\" \"finded\" tidak ada."},
{q:"Pewawancara bertanya tentang project tim. Cara bercerita mana yang paling baik?",
o:["Selalu memakai \"we\" supaya terlihat rendah hati","Memakai \"we\" untuk konteks tim dan \"I\" untuk kontribusi pribadimu","Selalu memakai \"I\" walaupun bukan kamu yang mengerjakan","Tidak menyebut tim sama sekali"],a:1,
w:"Pewawancara menilai dirimu, jadi kontribusimu harus jelas dengan \"I\". Konteks tim tetap disebut dengan \"we\" agar jujur dan menunjukkan kemampuan bekerja sama. Mengklaim pekerjaan orang lain bisa terbongkar di pertanyaan lanjutan."},
{q:"Lengkapi: \"I compressed the images and added lazy loading. ___, the page load time dropped from 6 to 2 seconds.\"",
o:["However","As a result","Because","Although"],a:1,
w:"Kalimat kedua adalah akibat dari tindakan di kalimat pertama, jadi dipakai \"As a result\". \"However\" untuk pertentangan, \"Because\" untuk alasan, dan \"Although\" untuk pengakuan yang bertentangan."},
{q:"Deskripsi mana yang paling kuat untuk wawancara?",
o:["\"I made the website better.\"","\"I worked on performance.\"","\"I reduced the product page load time from 6 seconds to 2 seconds by optimizing images and splitting the JavaScript bundle.\"","\"The website was slow but now it's okay.\""],a:2,
w:"Jawaban ketiga menyebut tindakan spesifik dan hasil yang terukur. Pewawancara bisa membayangkan apa yang kamu lakukan dan dampaknya. Tiga pilihan lain terlalu umum untuk menunjukkan kemampuan."},
{q:"Apa arti \"I was in charge of the frontend\"?",
o:["Aku mengisi daya perangkat frontend","Aku bertanggung jawab atas bagian frontend","Aku dibayar untuk frontend","Aku menyerahkan frontend ke orang lain"],a:1,
w:"\"in charge of\" berarti bertanggung jawab atau memimpin sesuatu. Frasa ini sangat berguna untuk menjelaskan peranmu dalam project tim."}
]
},
{
id: "e4", days: 7, title: "Metode STAR",
goals: [
"Menyebut dan mengenali empat bagian STAR",
"Membuat bagian Action menjadi yang paling detail",
"Menutup dengan Result yang terukur, termasuk untuk pertanyaan tentang kesalahan"
],
material: `
<h3>Empat bagian STAR</h3>
<div class="tbl"><table>
<tr><th>Bagian</th><th>Isi</th><th>Porsi</th></tr>
<tr><td><b>S</b>ituation</td><td>Konteks singkat: kapan, di mana, masalahnya apa</td><td>±15%</td></tr>
<tr><td><b>T</b>ask</td><td>Tanggung jawabmu atau target yang harus dicapai</td><td>±10%</td></tr>
<tr><td><b>A</b>ction</td><td>Langkah yang <u>kamu</u> ambil, dan kenapa</td><td>±50%</td></tr>
<tr><td><b>R</b>esult</td><td>Hasil terukur dan apa yang dipelajari</td><td>±25%</td></tr>
</table></div>
<h3>Contoh</h3>
<blockquote><b>S:</b> Two weeks before a big sale, our checkout page kept crashing on older Android phones.<br>
<b>T:</b> I was responsible for finding the cause and fixing it before launch.<br>
<b>A:</b> First, I reproduced the issue on a test device. Then I used the Performance panel and found that a large third-party script blocked the main thread. I moved it so it loaded only after user interaction, and I split our own bundle.<br>
<b>R:</b> The crashes stopped, and the checkout page became interactive about two seconds faster. We launched on time.</blockquote>
<h3>Pertanyaan perilaku yang sering muncul</h3>
<ul>
<li>"Tell me about a time you disagreed with a teammate."</li>
<li>"Tell me about a mistake you made."</li>
<li>"Tell me about a time you had a tight deadline."</li>
<li>"Tell me about a time you learned something quickly."</li>
</ul>
<h3>Pertanyaan tentang kesalahan</h3>
<p>Pewawancara mencari tiga hal: kamu mengakui kesalahannya, kamu memperbaikinya, dan kamu mengubah sesuatu supaya tidak terulang. Jangan memilih "kesalahan" palsu seperti "I work too hard."</p>
<h3>Pertanyaan tentang perbedaan pendapat</h3>
<p>Tunjukkan bahwa kamu mendengarkan, memakai data atau eksperimen kecil, dan tetap menghormati keputusan akhir. Jangan menjawab "I never disagree with anyone."</p>`,
questions: [
{q:"Dalam STAR, huruf R berarti...",
o:["Reason","Result","Review","Responsibility"],a:1,
w:"STAR adalah Situation, Task, Action, Result. Result adalah hasil dari tindakanmu, sebaiknya terukur. Tanggung jawabmu dijelaskan di bagian Task."},
{q:"Bagian mana yang seharusnya paling panjang dan detail?",
o:["Situation","Task","Action","Result"],a:2,
w:"Action menunjukkan apa yang benar-benar kamu lakukan dan cara berpikirmu, dan itulah yang dinilai pewawancara. Situation dan Task cukup singkat sebagai konteks. Result penting, tapi biasanya cukup satu sampai dua kalimat."},
{q:"Kalimat \"Two weeks before launch, our checkout page kept crashing on older Android phones.\" termasuk bagian...",
o:["Situation","Task","Action","Result"],a:0,
w:"Kalimat ini menjelaskan konteks dan masalah: kapan dan apa yang terjadi. Itu adalah Situation. Belum ada tanggung jawabmu (Task), langkah yang diambil (Action), atau hasil (Result)."},
{q:"Pertanyaan: \"Tell me about a time you disagreed with a teammate.\" Pendekatan jawaban mana yang terbaik?",
o:["\"I never disagree with anyone.\"","Menceritakan bagaimana kamu menang dan rekanmu salah","Menceritakan situasi nyata: kamu mendengarkan alasannya, mengusulkan uji coba kecil dengan data, lalu tim memilih berdasarkan hasilnya","Menolak menjawab karena terlalu pribadi"],a:2,
w:"Pewawancara menilai cara kamu berkolaborasi saat ada konflik. Jawaban ketiga menunjukkan sikap menghormati, berbasis data, dan berorientasi pada hasil tim. Mengaku tidak pernah berbeda pendapat terdengar tidak jujur, dan fokus pada \"menang\" menunjukkan sulit bekerja sama."},
{q:"Result mana yang paling kuat?",
o:["\"It went well.\"","\"Everyone was happy.\"","\"The crashes stopped, the page became interactive about two seconds faster, and we launched on time.\"","\"I did my best.\""],a:2,
w:"Result yang kuat menyebut dampak yang bisa diukur atau diamati. Tiga pilihan lain terlalu umum dan tidak membuktikan apa pun tentang kualitas pekerjaanmu."},
{q:"Pertanyaan: \"Tell me about a mistake you made.\" Apa yang paling ingin dilihat pewawancara?",
o:["Bahwa kamu tidak pernah membuat kesalahan","Kesalahan nyata, bagaimana kamu memperbaikinya, dan apa yang kamu ubah supaya tidak terulang","Siapa yang sebenarnya bersalah","Kesalahan yang sebenarnya pujian, seperti \"I work too hard\""],a:1,
w:"Pertanyaan ini menguji kejujuran dan kemampuan belajar. Kesalahan nyata yang diikuti perbaikan dan perubahan proses menunjukkan kedewasaan. Menyalahkan orang lain atau memberi kesalahan palsu adalah tanda bahaya bagi pewawancara."}
]
},
{
id: "e5", days: 5, title: "Kosakata kerja tim tech",
goals: [
"Memahami istilah yang sering muncul di rapat dan wawancara",
"Memakai istilah itu dalam kalimat sendiri"
],
material: `
<div class="tbl"><table>
<tr><th>Istilah</th><th>Arti</th><th>Contoh kalimat</th></tr>
<tr><td>trade-off</td><td>Kompromi: mendapat sesuatu dengan mengorbankan hal lain</td><td>The trade-off is a bigger bundle for faster development.</td></tr>
<tr><td>to refactor</td><td>Merapikan struktur kode tanpa mengubah perilakunya</td><td>I refactored the form into smaller components.</td></tr>
<tr><td>edge case</td><td>Kasus tidak biasa di batas kondisi</td><td>What about the edge case where the list is empty?</td></tr>
<tr><td>bottleneck</td><td>Bagian yang memperlambat seluruh sistem</td><td>The database query was the bottleneck.</td></tr>
<tr><td>scalable</td><td>Tetap bekerja baik saat beban atau ukuran bertambah</td><td>We needed a scalable way to handle images.</td></tr>
<tr><td>deprecated</td><td>Masih bisa dipakai tapi tidak disarankan dan akan dihapus</td><td>This API is deprecated, so we migrated.</td></tr>
<tr><td>to ship</td><td>Merilis ke pengguna</td><td>We shipped the feature last sprint.</td></tr>
<tr><td>to roll back</td><td>Kembali ke versi sebelumnya</td><td>We rolled back the release after the error.</td></tr>
<tr><td>blocker</td><td>Hal yang menghentikan pekerjaan</td><td>My blocker is the missing API endpoint.</td></tr>
<tr><td>to estimate</td><td>Memperkirakan waktu atau usaha</td><td>I estimated three days for this ticket.</td></tr>
</table></div>
<p class="tip">Latihan: setiap hari buat dua kalimat tentang pekerjaanmu sendiri memakai dua istilah dari tabel, lalu ucapkan dengan suara keras.</p>`,
questions: [
{q:"Apa arti \"to refactor\" code?",
o:["Menambah fitur baru","Merapikan struktur kode tanpa mengubah perilakunya","Menghapus seluruh kode","Memperbaiki desain tampilan"],a:1,
w:"Refactoring mengubah struktur internal kode supaya lebih mudah dibaca dan dirawat, sementara hasil yang dilihat pengguna tetap sama. Menambah fitur atau mengubah tampilan bukan refactoring."},
{q:"Rekan kerja bertanya: \"What about the edge case where the user has no orders?\" Maksudnya...",
o:["Kasus paling umum","Kasus tidak biasa di batas kondisi yang mungkin terlewat","Fitur di tepi layar","Bug yang sudah diperbaiki"],a:1,
w:"Edge case adalah situasi tidak biasa atau ekstrem, seperti daftar kosong, input sangat panjang, atau nilai nol. Kasus seperti ini sering menyebabkan bug karena terlupakan saat menulis kode."},
{q:"\"This API is deprecated.\" Artinya...",
o:["API itu sudah dihapus dan tidak bisa dipakai","API itu masih bisa dipakai, tapi tidak disarankan dan kemungkinan akan dihapus","API itu baru dirilis","API itu gratis"],a:1,
w:"Deprecated berarti fitur masih berfungsi, tapi sudah dinyatakan usang dan akan dihapus di versi mendatang. Itu tanda untuk mulai pindah ke alternatifnya."},
{q:"\"The database query was the bottleneck.\" Artinya...",
o:["Query itu bagian tercepat","Query itu bagian yang memperlambat seluruh proses","Query itu tidak dipakai","Query itu mengandung bug keamanan"],a:1,
w:"Bottleneck (leher botol) adalah titik yang membatasi kecepatan seluruh sistem, seperti leher botol yang membatasi aliran air. Memperbaiki bottleneck biasanya memberi peningkatan terbesar."},
{q:"Di daily standup, kamu tidak bisa melanjutkan pekerjaan karena endpoint API belum siap. Kalimat yang paling tepat adalah...",
o:["\"My blocker is the missing API endpoint.\"","\"My bottleneck is lunch.\"","\"I deprecated the endpoint.\"","\"I rolled back my work.\""],a:0,
w:"Blocker adalah hal yang menghentikan pekerjaanmu, dan kata ini sangat umum di standup. Tiga pilihan lain memakai istilah yang artinya tidak sesuai dengan situasi."},
{q:"\"We had to roll back the release.\" Artinya...",
o:["Merilis versi baru lebih cepat","Mengembalikan aplikasi ke versi sebelumnya","Menunda rilis tanpa batas","Mempromosikan rilis"],a:1,
w:"Roll back berarti kembali ke versi sebelumnya, biasanya karena rilis baru menimbulkan masalah. Lawannya adalah roll out, yaitu merilis bertahap."}
]
},
{
id: "e6", days: 6, title: "Berpikir keras saat live coding",
goals: [
"Mengklarifikasi soal sebelum mulai menulis kode",
"Menjelaskan pendekatan dan kompleksitas dengan kalimat sederhana",
"Menguji solusi sendiri dan menerima petunjuk dengan baik"
],
material: `
<p>Saat live coding, pewawancara menilai cara berpikirmu, bukan hanya hasil akhir. Diam selama 10 menit lalu menunjukkan jawaban benar sering dinilai lebih rendah daripada berpikir keras dengan beberapa kesalahan kecil.</p>
<h3>1. Klarifikasi dulu</h3>
<ul>
<li>"Let me make sure I understand the problem. We need to..."</li>
<li>"Can the input be empty?" / "Can there be duplicates?"</li>
<li>"Should I optimize for readability or performance here?"</li>
</ul>
<h3>2. Jelaskan rencana sebelum menulis</h3>
<ul>
<li>"My first idea is a simple loop. It's O(n²), but let's start there and improve it."</li>
<li>"I'm considering two approaches: ... or ..."</li>
</ul>
<h3>3. Bicara sambil menulis</h3>
<ul>
<li>"Here I'm creating a map so I can look up values quickly."</li>
<li>"I'm not sure about this part yet. Let me come back to it."</li>
</ul>
<h3>4. Kompleksitas dengan kalimat sederhana</h3>
<ul>
<li>"This is O(n) because we go through the array once."</li>
<li>"It uses extra memory for the map, so the space complexity is also O(n)."</li>
</ul>
<h3>5. Uji sendiri</h3>
<ul>
<li>"Let me test it with a few cases, including an empty array."</li>
</ul>
<h3>6. Menerima petunjuk</h3>
<ul>
<li>"That's a good point, thanks. So if I use a set here, I can..."</li>
</ul>`,
questions: [

<script>
(function(){
"use strict";
const DAY = 864e5;
const KEY = "jalur-naik-level-v1";
const app = document.getElementById("app");
const trackColor = { tek:["var(--tek)","var(--tek-soft)"], eng:["var(--eng)","var(--eng-soft)"] };

/* ---------- state ---------- */
let S = { v:1, t:{} };
let saveMode = "memory";   // memory | local | db
let dbRef = null;
let saving = Promise.resolve();
let dirty = false;

function tState(id){ return S.t[id] || (S.t[id] = { startedAt:null, readAt:null, needReview:false, passedAt:null, attempts:[] }); }
function loadLocal(){ try{ const raw = localStorage.getItem(KEY); if(raw){ const d = JSON.parse(raw); if(d && d.t) return d; } }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); if(saveMode==="memory") saveMode="local"; }catch(e){} }
function persist(){
  saveLocal();
  if(!dbRef) return;
  dirty = true;
  saving = saving.then(async () => {
    if(!dirty) return;
    dirty = false;
    try{ await dbRef.set(JSON.parse(JSON.stringify(S))); }
    catch(e){ /* tetap tersimpan di browser */ }
  });
}
function newer(a,b){
  const score = s => Object.values((s&&s.t)||{}).reduce((n,x)=> n + (x.attempts||[]).length + (x.passedAt?10:0) + (x.readAt?1:0), 0);
  return score(a) >= score(b) ? a : b;
}
async function initDb(){
  const c = window.claude;
  if(!c || typeof c.use !== "function") return;
  try{
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    if(snap.exists){
      const remote = snap.data();
      if(remote && remote.t){ S = JSON.parse(JSON.stringify(newer(remote, S))); }
    }
    dbRef = ref; saveMode = "db";
    saveLocal();
    if(!snap.exists && Object.keys(S.t).length){ persist(); }
    render();
  }catch(e){ /* tetap memakai penyimpanan browser */ }
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function today0(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function dayIndex(startedAt){ if(!startedAt) return 0; const s = new Date(startedAt); s.setHours(0,0,0,0); return Math.floor((today0() - s.getTime())/DAY) + 1; }
function fmtDate(ts){ return new Date(ts).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); }
function shuffle(a){ const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function findTarget(id){ for(const tr of TRACKS){ const i = tr.targets.findIndex(t=>t.id===id); if(i>=0) return { track:tr, target:tr.targets[i], index:i }; } return null; }
function unlocked(track, i){ return i===0 || !!tState(track.targets[i-1].id).passedAt; }
function status(track, i){
  const t = track.targets[i], st = S.t[t.id];
  if(st && st.passedAt) return "done";
  if(!unlocked(track,i)) return "lock";
  if(st && st.needReview) return "redo";
  if(st && st.startedAt && dayIndex(st.startedAt) > t.days) return "late";
  if(st && st.startedAt) return "run";
  return "open";
}

/* ---------- view state ---------- */
let view = { name:"home" };
let exam = null; // { targetId, order:[{qi, opts:[origIdx...]}], answers:{}, submitted:false, result }

function go(v){ view = v; render(); window.scrollTo({top:0}); }

/* ---------- render ---------- */
function render(){
  if(view.name === "home") renderHome();
  else renderTarget();
}

function saveBadge(){
  const txt = saveMode==="db" ? "Progres tersimpan di akunmu" : saveMode==="local" ? "Progres tersimpan di browser ini" : "Progres hanya tersimpan selama halaman terbuka";
  return '<span class="save '+(saveMode==="db"?"db":"")+'"><i></i>'+txt+'</span>';
}

function renderHome(){
  let h = '<header class="top"><div><div class="eyebrow">Persiapan kerja di luar negeri</div><h1>Jalur Naik Level</h1>'
    + '<p class="lead">Dua jalur yang berjalan bersamaan: fondasi teknis web developer dan bahasa Inggris untuk wawancara. Setiap target punya materi, batas hari, dan ujian.</p></div>'
    + saveBadge() + '</header>';
  h += '<div class="rule"><span><b>Lulus = 100% benar.</b> Satu jawaban salah berarti mengulang materi dulu.</span><span><b>Target berikutnya terbuka</b> setelah target sebelumnya lulus.</span><span><b>Hitungan hari</b> dimulai saat target pertama kali dibuka.</span></div>';
  h += '<div class="tracks">';
  for(const tr of TRACKS){
    const [c, cs] = trackColor[tr.id];
    const done = tr.targets.filter(t => S.t[t.id] && S.t[t.id].passedAt).length;
    const totalDays = tr.targets.reduce((n,t)=>n+t.days,0);
    h += '<section class="track" style="--c:'+c+';--cs:'+cs+'">';
    h += '<div class="track-head"><h2>'+esc(tr.name)+'</h2><span class="muted num">'+done+' / '+tr.targets.length+' lulus · rencana '+totalDays+' hari</span></div>';
    h += '<div class="bar"><span style="width:'+(done/tr.targets.length*100)+'%"></span></div>';
    h += '<div class="list">';
    tr.targets.forEach((t,i) => {
      const s = status(tr,i), st = S.t[t.id];
      let pill = "", sub = t.days+" hari · "+t.questions.length+" soal";
      if(s==="done"){ pill='<span class="pill p-done">Lulus</span>'; sub = "Lulus "+fmtDate(st.passedAt)+" · "+st.attempts.length+"× ujian"; }
      else if(s==="lock"){ pill='<span class="pill p-lock">Terkunci</span>'; }
      else if(s==="redo"){ pill='<span class="pill p-redo">Ulangi materi</span>'; }
      else if(s==="late"){ pill='<span class="pill p-late">Lewat '+(dayIndex(st.startedAt)-t.days)+' hari</span>'; sub = "Hari "+dayIndex(st.startedAt)+" dari "+t.days; }
      else if(s==="run"){ pill='<span class="pill p-run num">Hari '+dayIndex(st.startedAt)+'/'+t.days+'</span>'; }
      else { pill='<span class="pill p-run">Siap dimulai</span>'; }
      const cls = "item " + (s==="done"?"done":(s!=="lock"?"on":""));
      h += '<button class="'+cls+'" data-open="'+t.id+'" '+(s==="lock"?'disabled':'')+'><span class="idx num">'+(i+1)+'</span><span><span class="t">'+esc(t.title)+'</span><br><span class="s">'+esc(sub)+'</span></span>'+pill+'</button>';
    });
    h += '</div></section>';
  }
  h += '</div>';
  h += renderBackup();
  h += '<footer class="foot"><span>Materi disusun berdasarkan rencana belajar di dokumenmu. Kerjakan satu target di setiap jalur secara bersamaan.</span>'
    + '<span class="row"><button class="linkbtn" data-act="bk-export">Simpan cadangan</button><button class="linkbtn" data-act="bk-import">Pulihkan cadangan</button></span>'
    + (view.confirmReset
      ? '<span class="row"><span>Hapus semua progres?</span><button class="linkbtn danger" data-act="reset-yes">Ya, hapus</button><button class="linkbtn" data-act="reset-no">Batal</button></span>'
      : '<button class="linkbtn" data-act="reset">Mulai ulang dari awal</button>')
    + '</footer>';
  app.innerHTML = h;
}

function encodeBackup(){ return "JNL1:" + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function decodeBackup(txt){
  const s = String(txt).trim().replace(/^JNL1:/, "");
  const d = JSON.parse(decodeURIComponent(escape(atob(s))));
  if(!d || typeof d.t !== "object") throw new Error("format");
  return d;
}
function renderBackup(){
  if(!view.backup) return "";
  let h = '<section class="goals" id="backup">';
  if(view.backup === "export"){
    h += '<span class="eyebrow">Kode cadangan progres</span><p>Salin kode ini dan simpan di tempat aman, misalnya catatan di HP atau pesan WhatsApp ke dirimu sendiri. Tempelkan lagi lewat "Pulihkan cadangan" di perangkat atau browser mana pun.</p>'
      + '<textarea id="bk-out" readonly rows="4" style="width:100%;font-family:var(--f-mono);font-size:12px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)">'+esc(encodeBackup())+'</textarea>'
      + '<div class="row"><button class="btn" style="--c:var(--tek)" data-act="bk-copy">Salin kode</button><button class="btn ghost" data-act="bk-close">Tutup</button><span class="muted" id="bk-msg" style="font-size:14px"></span></div>';
  }else{
    h += '<span class="eyebrow">Pulihkan dari kode cadangan</span><p>Tempel kode cadangan di bawah. Progres di halaman ini akan diganti dengan isi cadangan.</p>'
      + '<textarea id="bk-in" rows="4" placeholder="JNL1:..." style="width:100%;font-family:var(--f-mono);font-size:12px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)"></textarea>'
      + '<div class="row"><button class="btn" style="--c:var(--tek)" data-act="bk-apply">Pulihkan</button><button class="btn ghost" data-act="bk-close">Tutup</button><span id="bk-msg" style="font-size:14px"></span></div>';
  }
  return h + '</section>';
}

function renderTarget(){
  const f = findTarget(view.id); if(!f){ go({name:"home"}); return; }
  const { track, target, index } = f;
  const [c, cs] = trackColor[track.id];
  const st = tState(target.id);
  const tab = view.tab || "materi";
  const di = dayIndex(st.startedAt);
  const examReady = !!st.readAt && !st.needReview;

  let h = '<div style="--c:'+c+';--cs:'+cs+';display:flex;flex-direction:column;gap:22px">';
  h += '<button class="back" data-act="home">← Semua target</button>';
  h += '<div class="dhead"><div class="dmeta"><span class="chip">'+esc(track.short)+' · Target '+(index+1)+'</span>'
     + (st.passedAt ? '<span class="pill p-done">Lulus '+fmtDate(st.passedAt)+'</span>' : '<span class="muted num">Hari '+Math.max(di,1)+' dari '+target.days+'</span>')
     + '</div><h2 style="font-size:clamp(24px,4vw,32px)">'+esc(target.title)+'</h2>';
  if(!st.passedAt){
    h += '<div class="days" aria-hidden="true">';
    const n = Math.max(target.days, di);
    for(let d=1; d<=n; d++){ h += '<span class="'+(d<=di ? (d>target.days?"over":"past") : "")+'"></span>'; }
    h += '</div>';
    if(di > target.days) h += '<p class="muted" style="font-size:14px">Sudah lewat '+(di-target.days)+' hari dari target. Tidak apa-apa, lanjutkan sampai lulus.</p>';
  }
  h += '</div>';
  h += '<div class="goals"><span class="eyebrow">Setelah '+target.days+' hari, kamu harus bisa</span><ul>'+target.goals.map(g=>'<li>'+esc(g)+'</li>').join("")+'</ul></div>';

  h += '<div class="tabs" role="tablist">'
     + '<button class="tab" role="tab" aria-selected="'+(tab==="materi")+'" data-tab="materi">Materi</button>'
     + '<button class="tab" role="tab" aria-selected="'+(tab==="ujian")+'" data-tab="ujian">Ujian</button>'
     + '<button class="tab" role="tab" aria-selected="'+(tab==="riwayat")+'" data-tab="riwayat">Riwayat ('+st.attempts.length+')</button>'
     + '</div>';

  if(tab === "materi"){
    if(st.needReview){
      const last = st.attempts[st.attempts.length-1];
      h += '<div class="notice n-bad"><b>Nilai terakhir '+last.score+' dari '+last.total+'.</b><span>Pelajari ulang materi ini, terutama bagian yang berkaitan dengan soal yang salah. Setelah itu tekan tombol di bagian bawah untuk membuka ujian lagi.</span>'
        + (last.wrong && last.wrong.length ? '<span>Soal yang salah: '+last.wrong.map(w=>'<i>'+esc(w)+'</i>').join("; ")+'</span>' : '') + '</div>';
    }
    h += '<article class="mat">'+target.material+'</article>';
    if(st.passedAt){
      h += '<div class="row"><button class="btn" data-tab="ujian">Ujian lagi untuk latihan</button></div>';
    }else{
      h += '<div class="notice n-info"><span>'+(st.needReview ? 'Sudah membaca ulang dan yakin bisa menjawab semua soal dengan benar?' : 'Sudah memahami semua poin di atas dan bisa menjelaskannya dengan kata-katamu sendiri?')+'</span>'
        + '<div class="row"><button class="btn" data-act="read">'+(st.needReview ? 'Saya sudah mengulang materi' : 'Saya sudah mempelajari materi ini')+'</button></div></div>';
    }
  }

  if(tab === "ujian"){
    const showingResult = exam && exam.targetId === target.id && exam.submitted;
    if(!examReady && !st.passedAt && !showingResult){
      h += '<div class="notice n-info">'+(st.needReview
        ? '<b>Ujian terkunci.</b><span>Ulangi materi dulu, lalu tekan "Saya sudah mengulang materi" di akhir halaman materi.</span>'
        : '<b>Pelajari materinya dulu.</b><span>Tekan "Saya sudah mempelajari materi ini" di akhir halaman materi untuk membuka ujian.</span>')
        + '<div class="row"><button class="btn" data-tab="materi">Buka materi</button></div></div>';
    }else{
      h += renderExam(track, target, st);
    }
  }

  if(tab === "riwayat"){
    if(!st.attempts.length){ h += '<p class="muted">Belum ada ujian untuk target ini.</p>'; }
    else{
      h += '<div class="hist">' + st.attempts.slice().reverse().map((a,k) =>
        '<div><span>Ujian ke-'+(st.attempts.length-k)+' · '+fmtDate(a.at)+'</span><span class="num" style="font-weight:700;color:'+(a.score===a.total?'var(--good)':'var(--bad)')+'">'+a.score+' / '+a.total+'</span></div>').join("") + '</div>';
      if(st.startedAt) h += '<p class="muted" style="font-size:14px">Mulai '+fmtDate(st.startedAt)+(st.passedAt ? ', lulus '+fmtDate(st.passedAt)+' (hari ke-'+(Math.floor((new Date(st.passedAt).setHours(0,0,0,0) - new Date(st.startedAt).setHours(0,0,0,0))/DAY)+1)+' dari '+target.days+').' : '.')+'</p>';
    }
  }
  h += '</div>';
  app.innerHTML = h;
}

function startExam(target){
  exam = {
    targetId: target.id,
    order: shuffle(target.questions.map((_,i)=>i)).map(qi => ({ qi, opts: shuffle(target.questions[qi].o.map((_,k)=>k)) })),
    answers: {}, submitted: false
  };
}

function renderExam(track, target, st){
  if(!exam || exam.targetId !== target.id) startExam(target);
  const total = exam.order.length;
  let h = '<div class="exam">';
  if(exam.submitted){
    const r = exam.result;
    h += r.pass
      ? '<div class="notice n-good"><span class="score num">'+r.score+' / '+total+'</span><b>Lulus. Semua jawaban benar.</b><span>'+(r.next ? 'Target berikutnya, "'+esc(r.next.title)+'", sudah terbuka.' : 'Kamu sudah menyelesaikan semua target di jalur ini.')+'</span></div>'
      : '<div class="notice n-bad"><span class="score num">'+r.score+' / '+total+'</span><b>Belum lulus.</b><span>Batas lulus adalah '+total+' dari '+total+'. Baca penjelasan di setiap soal, lalu ulangi materinya sebelum mencoba lagi.</span></div>';
  }else{
    h += '<p class="muted">'+total+' soal. Urutan soal dan pilihan diacak setiap ujian. Setelah dikirim, setiap soal menampilkan alasan kenapa jawabannya benar.</p>';
  }
  exam.order.forEach((o, n) => {
    const q = target.questions[o.qi];
    const ans = exam.answers[n];
    const qcls = exam.submitted ? (ans === q.a ? "ok" : "no") : "";
    h += '<fieldset class="q '+qcls+'" style="margin:0"><legend class="qn">Soal '+(n+1)+' dari '+total+'</legend>';
    h += '<p class="qt">'+esc(q.q)+'</p>';
    if(q.code) h += '<pre><code>'+esc(q.code)+'</code></pre>';
    h += '<div class="opts">';
    o.opts.forEach(k => {
      let cls = "opt", tag = "";
      if(exam.submitted){
        cls += " lockd";
        if(k === q.a){ cls += " right"; tag = '<span class="tag" style="color:var(--good)">Jawaban benar</span>'; }
        else if(k === ans){ cls += " wrong"; tag = '<span class="tag" style="color:var(--bad)">Jawabanmu</span>'; }
      }else if(k === ans){ cls += " sel"; }
      h += '<label class="'+cls+'"><input type="radio" id="q'+n+'o'+k+'" name="q'+n+'" value="'+k+'" '+(k===ans?'checked':'')+' '+(exam.submitted?'disabled':'')+' data-q="'+n+'"><span>'+esc(q.o[k])+'</span>'+tag+'</label>';
    });
    h += '</div>';
    if(exam.submitted){
      h += '<div class="why"><b>'+(ans===q.a ? 'Benar. Kenapa:' : 'Kenapa jawabannya "'+esc(q.o[q.a])+'":')+'</b>'+esc(q.w)+'</div>';
    }
    h += '</fieldset>';
  });
  const answered = Object.keys(exam.answers).length;
  if(!exam.submitted){
    h += '<div class="sticky"><span class="muted num">'+answered+' dari '+total+' dijawab</span><button class="btn" data-act="submit" '+(answered<total?'disabled':'')+'>Kirim jawaban</button></div>';
  }else{
    h += '<div class="row">' + (exam.result.pass
      ? (exam.result.next ? '<button class="btn" data-open="'+exam.result.next.id+'">Lanjut ke target berikutnya</button>' : '') + '<button class="btn ghost" data-act="home">Kembali ke semua target</button>'
      : '<button class="btn" data-tab="materi">Ulangi materi</button>') + '</div>';
  }
  h += '</div>';
  return h;
}

function submitExam(){
  const f = findTarget(exam.targetId); const { track, target, index } = f;
  const st = tState(target.id);
  let score = 0; const wrong = [];
  exam.order.forEach((o,n) => { const q = target.questions[o.qi]; if(exam.answers[n] === q.a) score++; else wrong.push(q.q.length > 90 ? q.q.slice(0,88)+"…" : q.q); });
  const total = exam.order.length, pass = score === total;
  st.attempts.push({ at: Date.now(), score, total, wrong });
  if(pass){ if(!st.passedAt) st.passedAt = Date.now(); st.needReview = false; }
  else if(!st.passedAt){ st.needReview = true; st.readAt = null; }
  const next = track.targets[index+1] || null;
  exam.submitted = true; exam.result = { score, pass, next };
  persist(); render();
  const first = document.querySelector(".exam .notice"); if(first) first.scrollIntoView({block:"start"});
}

/* ---------- events ---------- */
app.addEventListener("click", e => {
  const el = e.target.closest("[data-open],[data-act],[data-tab]");
  if(!el || el.disabled) return;
  if(el.dataset.open){
    const id = el.dataset.open, st = tState(id);
    if(!st.startedAt){ st.startedAt = Date.now(); persist(); }
    exam = null;
    go({ name:"target", id, tab:"materi" }); return;
  }
  if(el.dataset.tab){
    const tab = el.dataset.tab;
    if(tab === "ujian" && exam && exam.submitted){ exam = null; }
    view.tab = tab; render(); window.scrollTo({top:0}); return;
  }
  const act = el.dataset.act;
  if(act === "home"){ exam = null; go({ name:"home" }); }
  else if(act === "read"){ const st = tState(view.id); st.readAt = Date.now(); st.needReview = false; exam = null; persist(); view.tab = "ujian"; render(); window.scrollTo({top:0}); }
  else if(act === "submit"){ submitExam(); }
  else if(act === "bk-export" || act === "bk-import"){ view.backup = act === "bk-export" ? "export" : "import"; render(); const b = document.getElementById("backup"); if(b) b.scrollIntoView({block:"center"}); }
  else if(act === "bk-close"){ view.backup = null; render(); }
  else if(act === "bk-copy"){
    const ta = document.getElementById("bk-out"), msg = document.getElementById("bk-msg");
    const fallback = () => { ta.focus(); ta.select(); msg.textContent = "Kode sudah dipilih. Tekan Ctrl+C atau salin manual."; };
    try{ navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = "Kode tersalin."; }, fallback); }catch(err){ fallback(); }
  }
  else if(act === "bk-apply"){
    const msg = document.getElementById("bk-msg");
    try{ S = decodeBackup(document.getElementById("bk-in").value); exam = null; persist(); view.backup = null; render(); }
    catch(err){ msg.style.color = "var(--bad)"; msg.textContent = "Kode tidak dikenali. Pastikan seluruh kode tersalin, termasuk awalan JNL1:."; }
  }
  else if(act === "reset"){ view.confirmReset = true; render(); }
  else if(act === "reset-no"){ view.confirmReset = false; render(); }
  else if(act === "reset-yes"){ S = { v:1, t:{} }; exam = null; persist(); go({ name:"home" }); }
});
app.addEventListener("change", e => {
  const inp = e.target;
  if(inp.matches('input[type="radio"][data-q]') && exam && !exam.submitted){
    exam.answers[+inp.dataset.q] = +inp.value;
    const fs = inp.closest(".opts");
    fs.querySelectorAll(".opt").forEach(l => l.classList.toggle("sel", l.contains(inp)));
    const answered = Object.keys(exam.answers).length, total = exam.order.length;
    const bar = app.querySelector(".sticky");
    if(bar){ bar.querySelector("span").textContent = answered+" dari "+total+" dijawab"; bar.querySelector("button").disabled = answered < total; }
  }
});

/* ---------- boot ---------- */
const local = loadLocal();
if(local){ S = local; saveMode = "local"; }
render();
initDb();
})();
</script>
